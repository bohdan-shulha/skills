interface:
  display_name: "Verified Change Skill"
  short_description: "Coder + adversarial verifier, two passes"
  default_prompt: "Implement the change as a two-pass workflow: a coder agent makes it, then an independent verifier agent re-runs every check itself and must prove the stated invariant with its own command output before it ships. The verifier judges against the spec, not the coder's report. Skipping lint is a NO_SHIP. Blockers get one bounded fix and re-verify round. Judge the final verdict before accepting it."
